<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Kalkulator Pink Soft</title>

    <!-- Menghubungkan CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>🎀 Kalkulator 🎀</h1>

        <p class="subtitle">
            Kalkulator Matematika Sederhana
        </p>

        <!-- Input Angka -->
        <div class="input-group">

            <label for="angka1">
                ♡ Angka Pertama
            </label>

            <input
                type="number"
                id="angka1"
                placeholder="Masukkan angka pertama"
                oninput="hapusHasil()"
            >

            <label for="angka2">
                ♡ Angka Kedua
            </label>

            <input
                type="number"
                id="angka2"
                placeholder="Masukkan angka kedua"
                oninput="hapusHasil"
            >

        </div>

        <!-- Tombol Operasi -->
        <div class="buttons">

            <button onclick="tambah()">
                + Tambah
            </button>

            <button onclick="kurang()">
                − Kurang
            </button>

            <button onclick="kali()">
                × Kali
            </button>

            <button onclick="bagi()">
                ÷ Bagi
            </button>

        </div>

        <!-- Hasil Perhitungan -->
        <div class="hasil-box">

            <h3>♡ Hasil Perhitungan ♡</h3>

            <span id="hasil">0</span>

        </div>

    </div>

    <!-- Menghubungkan JavaScript -->
    <script src="script.js"></script>

</body>
</html>
